<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8">

<div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600/20 text-indigo-400 p-3 rounded-xl border border-indigo-500/30">
                <i class="fa-solid fa-wallet text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">Wallet Service</h1>
                <p class="text-xs text-slate-400">Панель управления</p>
            </div>
        </div>
        <div id="activeWalletBadge"
             class="hidden text-xs bg-indigo-950 border border-indigo-800 text-indigo-300 px-3 py-1.5 rounded-lg font-mono">
            Wallet ID: <span id="currentWalletId" class="font-bold text-white">--</span>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 space-y-6">

            <!-- Создать кошелек -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Создать кошелек</h2>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">User ID</label>
                        <input id="createUserId" type="number" min="1" max="999999999" value="1" placeholder="1"
                               oninput="if(this.value < 1 && this.value !== '') this.value = 1;"
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Валюта</label>
                        <input id="createCurrency" type="text" value="RUB" readonly
                               class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-400 cursor-not-allowed focus:outline-none">
                    </div>
                    <button onclick="createWallet()"
                            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition">
                        Создать
                    </button>
                </div>
            </div>

            <!-- Пополнение / списание -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Операции</h2>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Target Wallet ID</label>
                    <input id="actionWalletId" type="number" min="1" max="999999999" placeholder="1"
                           oninput="if(this.value < 1 && this.value !== '') this.value = 1;"
                           class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Сумма</label>
                    <input id="actionAmount" type="number" min="0.01" max="999999999999" step="0.01" placeholder="100"
                           oninput="if(this.value < 0) this.value = ''; if(this.value.length > 14) this.value = this.value.slice(0, 14);"
                           class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="getWallet()"
                            class="col-span-2 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg text-xs font-medium transition">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i> Найти / Баланс
                    </button>
                    <button onclick="deposit()"
                            class="bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-xs font-medium transition">
                        Пополнить
                    </button>
                    <button onclick="withdraw()"
                            class="bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-lg text-xs font-medium transition">
                        Списать
                    </button>
                </div>
            </div>

            <!-- Перевод -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-3">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Перевод</h2>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">От кого (ID)</label>
                        <input id="transferFrom" type="number" min="1" max="999999999" placeholder="1"
                               oninput="if(this.value < 1 && this.value !== '') this.value = 1;"
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Кому (ID)</label>
                        <input id="transferTo" type="number" min="1" max="999999999" placeholder="2"
                               oninput="if(this.value < 1 && this.value !== '') this.value = 1;"
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Сумма</label>
                    <input id="transferAmount" type="number" min="0.01" max="999999999999" step="0.01" placeholder="100"
                           oninput="if(this.value < 0) this.value = ''; if(this.value.length > 14) this.value = this.value.slice(0, 14);"
                           class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="transfer()"
                        class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-2 rounded-lg text-sm font-medium transition">
                    Перевести
                </button>
            </div>

        </div>

        <!-- Отображение данных и транзакций -->
        <div class="lg:col-span-2 space-y-6">

            <!-- Виджет баланса -->
            <div id="walletCard"
                 class="hidden bg-gradient-to-r from-indigo-900/40 to-slate-900 border border-indigo-500/30 rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs text-indigo-300 uppercase tracking-widest font-semibold">Баланс кошелька</span>
                        <div class="text-3xl font-extrabold text-white mt-1">
                            <span id="cardBalance">0.00</span> <span id="cardCurrency" class="text-indigo-400 text-xl">RUB</span>
                        </div>
                    </div>
                    <div class="text-right text-xs text-slate-400 space-y-1 font-mono">
                        <div>Wallet ID: <span id="cardWalletId" class="text-white"></span></div>
                        <div>User ID: <span id="cardUserId" class="text-white"></span></div>
                    </div>
                </div>
            </div>

            <!-- История транзакций -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">История транзакций</h2>
                    <button onclick="loadTransactions()"
                            class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">
                        <i class="fa-solid fa-rotate mr-1"></i> Обновить
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                        <tr class="border-b border-slate-800 text-slate-400 uppercase">
                            <th class="py-2 px-3">ID</th>
                            <th class="py-2 px-3">Тип</th>
                            <th class="py-2 px-3">Сумма</th>
                            <th class="py-2 px-3">Статус</th>
                            <th class="py-2 px-3">Дата</th>
                        </tr>
                        </thead>
                        <tbody id="txTableBody" class="divide-y divide-slate-800/50 text-slate-300">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-slate-500">Укажите Wallet ID и нажмите
                                "Найти"
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Лог ответа сервера -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ответ сервера</span>
                    <span id="responseStatus" class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">IDLE</span>
                </div>
                <pre id="jsonConsole"
                     class="bg-slate-950 p-4 rounded-xl text-emerald-400 font-mono text-xs overflow-x-auto min-h-[120px] max-h-[220px] border border-slate-800">Готов к работе...</pre>
            </div>

        </div>

    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
